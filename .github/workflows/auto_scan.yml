name: Bandarmology Auto Scan & Signal

on:
  schedule:
    - cron: '30 1 * * 1-5'   # 08:30 WIB
    - cron: '0 3 * * 1-5'    # 10:00 WIB
    - cron: '0 6 * * 1-5'    # 13:00 WIB
    - cron: '30 9 * * 1-5'   # 16:30 WIB
  workflow_dispatch:
    inputs:
      session:
        description: 'Session'
        required: true
        default: 'PRE_MARKET'
        type: choice
        options:
          - PRE_MARKET
          - POST_OPEN
          - MIDDAY
          - POST_MARKET

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: pip install -r requirements.txt
          
      - name: Run Pipeline + Scanner
        env:
          BROKER_API_TOKEN: ${{ secrets.BROKER_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SESSION: ${{ github.event.inputs.session || 'PRE_MARKET' }}
        run: python scanner/run_scan.py
          
      - name: Commit data changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --cached --quiet || git commit -m "Auto: signals [$(date)]"
          git push || echo "Nothing to commit"
          
