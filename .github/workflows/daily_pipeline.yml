name: Daily Pipeline + BI Export

on:
  schedule:
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

jobs:
  pipeline:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run Daily Pipeline
        env:
          BROKER_API_TOKEN: ${{ secrets.BROKER_API_TOKEN }}
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from idx_bandarmology import pipeline, config
          result = pipeline.run(tickers=config.WATCHLIST, price_period='1y', fetch_broker_data=True)
          print('Prices:', result['n_prices'])
          print('Broker:', result['n_broker'])
          "
      
      - name: BI Export Layer
        run: python scanner/bi_export.py
      
      - name: Backup SQLite to Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-backup-${{ github.run_id }}
          path: data/db/bandarmology.sqlite
          retention-days: 30
      
      - name: Commit data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          git diff --cached --quiet || git commit -m "Daily pipeline + BI export $(date)"
          git push || echo "Nothing to commit"
